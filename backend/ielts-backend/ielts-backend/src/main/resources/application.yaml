spring:
  application:
    name: ielts-backend

  # Credentials come from environment variables so they are never committed (see backend/README.md)
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/ielts_graph}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  servlet:
    multipart:
      max-file-size: ${SPEAKING_MAX_FILE_SIZE:30MB}
      max-request-size: ${SPEAKING_MAX_REQUEST_SIZE:32MB}

server:
  port: 8081

app:
  llm:
    provider: ${LLM_PROVIDER:gemini}
    api-key: ${GEMINI_API_KEY:${LLM_API_KEY:}}
    model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
    temperature: 0.3
    max-tokens: 8192
    timeout-seconds: 60
  speaking:
    audio-dir: ${SPEAKING_AUDIO_DIR:${java.io.tmpdir}/ielts-graph-speaking}
    max-file-size-bytes: ${SPEAKING_MAX_FILE_SIZE_BYTES:31457280}
    min-file-size-bytes: ${SPEAKING_MIN_FILE_SIZE_BYTES:100}
    min-duration-seconds: ${SPEAKING_MIN_DURATION_SECONDS:2.0}
    min-transcript-words: 10
    asr:
      url: ${SPEAKING_ASR_URL:http://127.0.0.1:8000/transcribe}
      timeout-seconds: ${SPEAKING_ASR_TIMEOUT:180}
      file-field: ${SPEAKING_ASR_FILE_FIELD:audio}
      fake: ${SPEAKING_ASR_FAKE:false}
  kg:
    neo4j:
      uri: ${KG_NEO4J_URI:bolt://localhost:7687}
      username: ${KG_NEO4J_USERNAME:neo4j}
      password: ${KG_NEO4J_PASSWORD:}
