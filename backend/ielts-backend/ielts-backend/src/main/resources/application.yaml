spring:
  application:
    name: ielts-backend

  # Credentials come from environment variables so they are never committed (see backend/README.md)
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/ielts_graph}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  servlet:
    multipart:
      max-file-size: ${SPEAKING_MAX_FILE_SIZE:30MB}
      max-request-size: ${SPEAKING_MAX_REQUEST_SIZE:32MB}

server:
  port: ${SERVER_PORT:8081}

app:
  llm:
    provider: ${LLM_PROVIDER:gemini}
    api-key: ${GEMINI_API_KEY:${LLM_API_KEY:}}
    model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
    temperature: 0.3
    max-tokens: 8192
    timeout-seconds: 60
  speaking:
    audio-dir: ${SPEAKING_AUDIO_DIR:${java.io.tmpdir}/ielts-graph-speaking}
    max-file-size-bytes: ${SPEAKING_MAX_FILE_SIZE_BYTES:31457280}
    min-file-size-bytes: ${SPEAKING_MIN_FILE_SIZE_BYTES:100}
    min-duration-seconds: ${SPEAKING_MIN_DURATION_SECONDS:2.0}
    min-transcript-words: 10
    asr:
      url: ${SPEAKING_ASR_URL:http://127.0.0.1:8000/transcribe}
      timeout-seconds: ${SPEAKING_ASR_TIMEOUT:180}
      file-field: ${SPEAKING_ASR_FILE_FIELD:audio}
      fake: ${SPEAKING_ASR_FAKE:false}
  kg:
    neo4j:
      uri: ${KG_NEO4J_URI:bolt://localhost:7687}
      username: ${KG_NEO4J_USERNAME:neo4j}
      password: ${KG_NEO4J_PASSWORD:}
  profile:
    initial-mastery: ${PROFILE_INITIAL_MASTERY:0.5}
    eta-min: ${PROFILE_ETA_MIN:0.10}
    offset: ${PROFILE_OFFSET:3.0}
    weight-error: ${PROFILE_WEIGHT_ERROR:1.0}
    # 0.5 instead of the 0.3 of the rules draft: drills no longer update the profile, and on the synthetic
    # learners without drill events 0.5 gives the lowest MAE (0.126 vs 0.142 at week 8) and faster recovery.
    weight-clean: ${PROFILE_WEIGHT_CLEAN:0.5}
    # Only used to replay the synthetic logs; real drills create no profile events.
    weight-drill: ${PROFILE_WEIGHT_DRILL:1.0}
    # Graded Writing/Speaking submissions missed by the profile (KG down) are applied by ProfileBackfillJob
    backfill-delay-ms: ${PROFILE_BACKFILL_DELAY_MS:300000}
  grading:
    # A submission GRADING for longer than this is failed by StaleGradingJob (must exceed ASR 180 s + 2 x LLM 60 s)
    stale-after: ${GRADING_STALE_AFTER:PT10M}
  jobs:
    # Background jobs (StaleGradingJob, ProfileBackfillJob)
    enabled: ${APP_JOBS_ENABLED:true}
